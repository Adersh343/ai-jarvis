<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Command Center</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="stars"></div>

    <div class="app-layout">

        <!-- ═══════════ LEFT: ORB PANEL ═══════════ -->
        <aside class="orb-side">

            <div class="brand">
                <div class="status-indicator">
                    <span class="pulse"></span>
                    <span class="status-text">AGENT ONLINE</span>
                </div>
                <h1>Command Center</h1>
                <p class="subtitle">Local AI · macOS Orchestration</p>
            </div>

            <div class="orb-center">
                <canvas id="orbCanvas" width="380" height="380"></canvas>
                <div id="orbLabel" class="orb-label">STANDBY</div>
            </div>

            <div class="orb-bottom">
                <button id="micBtn" class="mic-btn">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="15" height="15">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2H3v2a9 9 0 0 0 8 8.94V22H9v2h6v-2h-2v-1.06A9 9 0 0 0 21 12v-2h-2z"/>
                    </svg>
                    <span id="micLabel">VOICE OFF</span>
                </button>

                <div class="side-tags">
                    <div class="info-tag">Llama3.2</div>
                    <div class="info-tag">macOS</div>
                    <div id="ollamaStatus" class="ollama-status checking">
                        <span class="dot"></span>
                        <span class="label">Connecting...</span>
                    </div>
                </div>
            </div>

        </aside>

        <!-- ═══════════ RIGHT: TERMINAL PANEL ═══════════ -->
        <main class="terminal-side">

            <div class="terminal-header">
                <div class="dots"><span></span><span></span><span></span></div>
                <div class="title">system terminal</div>
                <div class="terminal-actions">
                    <span class="shortcut-hint">↑↓ history &nbsp;·&nbsp; Ctrl+L clear &nbsp;·&nbsp; Ctrl+C cancel</span>
                    <button id="clearBtn" class="action-btn">Clear</button>
                </div>
            </div>

            <div id="outputLog" class="output-log">
                <div class="log-entry system">
                    <span class="ts"></span>
                    <span class="content">System initialized. Orb ready.</span>
                </div>
            </div>

            <div class="input-area">
                <span class="prompt">❯</span>
                <input type="text" id="promptInput"
                       placeholder="Speak or type a command..."
                       autofocus autocomplete="off" spellcheck="false">
                <button id="sendBtn">
                    <span class="btn-text">Execute</span>
                    <span class="btn-loader"><span class="spinner"></span></span>
                </button>
            </div>

        </main>

    </div>

    <script src="script.js"></script>
</body>
</html>
